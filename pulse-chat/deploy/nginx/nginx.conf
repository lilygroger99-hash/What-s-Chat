worker_processes auto;
events { worker_connections 4096; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;

  # DSM's reverse proxy sits in front of us: take the client IP from X-Forwarded-For.
  # Tighten set_real_from to your docker bridge gateway if you want strictness.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 10.0.0.0/8;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  # --- rate limiting (second line of defence; the app has per-user/per-phone limits too)
  limit_req_zone  $binary_remote_addr zone=auth:10m  rate=10r/m;
  limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status  429;
  limit_conn_status 429;

  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  log_format main '$remote_addr "$request" $status $body_bytes_sent rt=$request_time';
  access_log /var/log/nginx/access.log main;

  # Slowloris / oversized-body protection
  client_header_timeout 10s;
  client_body_timeout   15s;
  client_max_body_size  64k;   # Phase 1 is JSON only. Raise on the media location in Phase 2.

  upstream app { server app:3000; keepalive 32; }

  server {
    listen 80 default_server;
    server_name _;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    limit_conn perip 50;

    location = /healthz { proxy_pass http://app; access_log off; }

    # OTP endpoints: very tight (bursts of 5 per IP, then 10/min)
    location /v1/auth/ {
      limit_req zone=auth burst=5 nodelay;
      proxy_pass http://app;
      include /etc/nginx/proxy_params.inc;
    }

    # WebSocket / long-polling transport
    location /socket.io/ {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
      # Socket.io pings every 20 s; keep idle sockets alive well beyond that, never buffer frames.
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_buffering off;
      limit_conn perip 20;
    }

    location /v1/ {
      limit_req zone=api burst=40 nodelay;
      proxy_pass http://app;
      include /etc/nginx/proxy_params.inc;
    }

    location / { return 404; }
  }
}
